<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Dad ❤️</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

</head>

<body>

<div id="particles"></div>
<div class="cursor-glow"></div>

<section class="hero">

<h1>MY FIRST HERO</h1>

<p>Happy Father's Day</p>

<div class="scroll-down">
↓
</div>

</section>

<section class="photo-section">

<div class="photo-card">
<img src="IMG_20260620_104925.jpg">
</div>

<h2>
The man who carried my dreams
before I even had them.
</h2>

</section>

<section class="words">

<span>Teacher</span>
<span>Guide</span>
<span>Protector</span>
<span>Mentor</span>
<span>Hero</span>
<span>Father</span>

</section>

<section class="photo-section">

<div class="photo-card">
<img src="IMG_20260620_104952.jpg">
</div>

<h2>
Every success of mine
contains a piece of your sacrifice.
</h2>

</section>

<section class="stats">

<div class="stat">
<div class="counter" data-target="999999">
0
</div>
<p>Lessons Given</p>
</div>

<div class="stat">
<div class="infinite">
∞
</div>
<p>Love Received</p>
</div>

<div class="stat">
<div class="infinite">
∞
</div>
<p>Support Given</p>
</div>

</section>

<section class="letter">

<h2>Dear Dad,</h2>

<p id="typing"></p>

</section>

<section class="ending">

<h1>DAD</h1>

<h2>THANK YOU</h2>

<h3>I LOVE YOU ❤️</h3>

</section>

<script src="script.js"></script>

</body>
</html>
