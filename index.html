<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Dad</title>
    <style>
        body { margin: 0; background: #fdfbf7; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        .container { width: 90%; max-width: 400px; text-align: center; }
        
        /* Envelope Styles */
        #envelope-screen { cursor: pointer; transition: opacity 0.5s; }
        .envelope { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* Main Content Styles */
        .hidden { display: none; }
        .section { background: white; margin: 20px 0; padding: 30px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        /* Card Flip Effect */
        .card { perspective: 1000px; cursor: pointer; }
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; position: relative; height: 100px; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; backface-visibility: hidden; }
        .back { transform: rotateY(180deg); }
    </style>
</head>
<body>

    <div id="envelope-screen" class="container" onclick="reveal()">
        <div class="envelope">💌 Tap to open a gift for Dad</div>
    </div>

    <div id="main-content" class="container hidden">
        <div class="section">
            <h2>For My First Hero</h2>
            <audio controls style="width:100%"><source src="song.mp3" type="audio/mpeg"></audio>
        </div>

        <div class="section card" onclick="this.classList.toggle('flipped')">
            <div class="card-inner">
                <div class="front"><h3>Tap to see a secret note</h3></div>
                <div class="back"><p>I am so proud to be yours.</p></div>
            </div>
        </div>
    </div>

    <script>
        function reveal() {
            document.getElementById('envelope-screen').style.display = 'none';
            document.getElementById('main-content').classList.remove('hidden');
        }
    </script>
</body>
</html>
